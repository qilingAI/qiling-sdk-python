[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "qiling-ai-sdk"
version = "0.5.0"
description = "Python SDK for Qiling AI licensing, API Key authorization, and open model APIs."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Qiling AI" }]
keywords = ["qiling-ai", "license", "payment", "sdk"]

[project.optional-dependencies]
openai = ["openai==3.31.0; python_version >= '3.10'"]

[project.urls]
Homepage = "https://toolsoul.daniu7.cn"

Repository = "https://github.com/qilingAI/qiling-sdk-python"
Documentation = "https://867fas1f7s.apifox.cn/"
Issues = "https://github.com/qilingAI/qiling-sdk-python/issues"
