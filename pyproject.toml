[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "qiling-ai-sdk"
version = "0.2.0"
description = "Python SDK for Qiling AI licensing, storefront, and payment APIs."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Qiling AI" }]
keywords = ["qiling-ai", "license", "payment", "sdk"]

[project.urls]
Homepage = "https://ql.xiazq.com"

Repository = "https://github.com/qilingAI/qiling-sdk-python"
Documentation = "https://867fas1f7s.apifox.cn/"
Issues = "https://github.com/qilingAI/qiling-sdk-python/issues"
